name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      # Cache the installed node_modules, keyed on the lockfile hash, so an
      # unchanged yarn.lock skips reinstalling dependencies entirely.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      # Generates src/types/generated/api.ts from the live backend's OpenAPI
      # spec, so typecheck/lint/test run against the current production DTOs.
      - run: yarn run codegen:types
        env:
          BACKEND_URL: https://app.reciplease.org
      # `yarn run check` (not `yarn check`, which is Yarn's lockfile verifier).
      - run: yarn run check
      - run: yarn test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      # Generates src/types/generated/api.ts, which application code imports
      # from — needed before `next dev` (booted by playwright.config.ts) can
      # resolve it.
      - run: yarn run codegen:types
        env:
          BACKEND_URL: https://app.reciplease.org
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts boots `npm run dev` with the env it needs
      # (auth disabled, BACKEND_URL pointing at the production API).
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Netlify
    needs: [unit, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      # Builds and deploys from this runner via the Netlify CLI (`--build`
      # invokes Netlify's own build system, incl. the Next.js runtime plugin,
      # locally) rather than relying on Netlify's git-push-triggered auto-build
      # — that's disabled on the site (build_settings.stop_builds = true, set
      # 2026-07-22) precisely so a deploy can never go out ahead of CI passing.
      # netlify.toml supplies the build command; BACKEND_URL/GOOGLE_CLIENT_ID/etc
      # are pulled from the site's own configured env vars by `--build`, not
      # duplicated here.
      # Pinned to the version verified working locally — an unpinned `npx
      # netlify-cli` resolves "latest" fresh on every run with no local cache,
      # which is slow and was the likely cause of one run hanging past 12
      # minutes in CI (a local run of the same command completed in ~50s).
      - run: npx --yes netlify-cli@26.1.0 deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
